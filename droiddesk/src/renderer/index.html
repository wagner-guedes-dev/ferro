<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>DroidDesk</title>
  <link rel="stylesheet" href="../../node_modules/flag-icons/css/flag-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h10V4H7zm3.5 1.5h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5zM12 17a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/></svg></div>
        <h1>Droid<span>Desk</span></h1>
      </div>
      <div class="nav-section" data-i18n="nav_primary">Principal</div>
      <button class="nav-item active" data-view="profiles"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg><span data-i18n="nav_profiles"></span><span class="count" id="count-profiles">0</span></button>
      <button class="nav-item" data-view="browsers"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg><span data-i18n="nav_browsers"></span><span class="count" id="count-browsers">0</span></button>
      <button class="nav-item" data-view="proxies"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span data-i18n="nav_proxies"></span><span class="count" id="count-proxies">0</span></button>
      <button class="nav-item" data-action="groups"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span data-i18n="nav_groups"></span><span class="count" id="count-groups">0</span></button>
      <div class="nav-section" data-i18n="nav_system">Sistema</div>
      <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="nav_settings"></span></button>
      <button class="nav-item" data-view="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span data-i18n="nav_help"></span></button>
      <div class="spacer"></div>
      <div class="sdk-pill" id="sdk-pill">
        <div class="row"><span class="dot" id="sdk-dot"></span><span id="sdk-text">...</span></div>
        <button class="link" id="sdk-setup-link" data-view="settings" data-i18n="sdk_setup"></button>
      </div>
      <div class="version" id="version"></div>
    </aside>

    <main class="main">
      <!-- ================= PROFILES ================= -->
      <section class="view active" id="view-profiles">
        <div class="topbar">
          <select class="select" id="filter-group" style="min-width:210px"></select>
          <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="input" id="filter-text" type="search" data-i18n-ph="search_profile"></div>
          <div class="seg" id="view-mode">
            <button data-mode="grid" class="active" data-i18n-title="view_grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
            <button data-mode="list" data-i18n-title="view_list"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          </div>
          <span style="flex:1"></span>
          <button class="btn primary" id="btn-new-profile"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="new_profile"></span></button>
        </div>
        <div class="toolbar">
          <button class="btn" data-bulk="start"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg><span data-i18n="start"></span></button>
          <button class="btn" data-bulk="stop"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span data-i18n="stop"></span></button>
          <button class="btn" data-bulk="move"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="move"></span></button>
          <button class="btn" data-bulk="export"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span data-i18n="export"></span></button>
          <button class="btn" data-bulk="checkproxy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><span data-i18n="check_proxy"></span></button>
          <button class="btn danger" data-bulk="delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span data-i18n="delete"></span></button>
          <span class="sep"></span>
          <button class="btn icon" id="btn-refresh" data-i18n-title="refresh"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
        </div>
        <div class="content" id="profiles-content"></div>
        <div class="footer">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="checkbox" id="select-all"><span data-i18n="select_all"></span></label>
          <span id="selected-count"></span>
          <span class="sep"></span>
          <span id="total-count"></span>
        </div>
      </section>

      <!-- ================= BROWSERS ================= -->
      <section class="view" id="view-browsers">
        <div class="topbar">
          <select class="select" id="bfilter-group" style="min-width:210px"></select>
          <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="input" id="bfilter-text" type="search" data-i18n-ph="search_profile"></div>
          <span style="flex:1"></span>
          <button class="btn primary" id="btn-new-browser"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="new_browser"></span></button>
        </div>
        <div class="toolbar">
          <button class="btn" data-bbulk="start"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg><span data-i18n="start"></span></button>
          <button class="btn" data-bbulk="stop"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span data-i18n="stop"></span></button>
          <button class="btn" data-bbulk="move"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="move"></span></button>
          <button class="btn" data-bbulk="checkproxy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><span data-i18n="check_proxy"></span></button>
          <button class="btn danger" data-bbulk="delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span data-i18n="delete"></span></button>
          <span class="sep"></span>
          <button class="btn icon" id="btn-brefresh" data-i18n-title="refresh"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
        </div>
        <div class="content" id="browsers-content"></div>
        <div class="footer">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="checkbox" id="bselect-all"><span data-i18n="select_all"></span></label>
          <span id="bselected-count"></span>
          <span class="sep"></span>
          <span id="btotal-count"></span>
        </div>
      </section>

      <!-- ================= PROXIES ================= -->
      <section class="view" id="view-proxies">
        <div class="topbar">
          <h2 data-i18n="proxies_title"></h2>
          <span style="flex:1"></span>
          <button class="btn outline" id="btn-check-all"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><span data-i18n="check_all"></span></button>
          <button class="btn outline" id="btn-import-proxies"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span data-i18n="import_proxies"></span></button>
          <button class="btn primary" id="btn-new-proxy"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="new_proxy"></span></button>
        </div>
        <div class="content" id="proxies-content"></div>
      </section>

      <!-- ================= SETTINGS ================= -->
      <section class="view" id="view-settings">
        <div class="topbar"><h2 data-i18n="settings_title"></h2></div>
        <div class="content"><div class="settings" id="settings-content"></div></div>
      </section>

      <!-- ================= HELP ================= -->
      <section class="view" id="view-help">
        <div class="topbar"><h2 data-i18n="help_title"></h2></div>
        <div class="content"><div class="help" id="help-content"></div></div>
      </section>
    </main>
  </div>

  <div class="ctx" id="ctx"></div>
  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
  <div id="toasts"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
