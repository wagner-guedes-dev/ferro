<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>DroidDesk HUD</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .hud { box-sizing: border-box; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(12, 14, 20, 0.9); border: 1px solid rgba(255,255,255,0.14); }
    .sig { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; }
    .sig i { display: block; width: 4px; border-radius: 1px; background: #3b4252; }
    .sig i:nth-child(1) { height: 6px; } .sig i:nth-child(2) { height: 10px; } .sig i:nth-child(3) { height: 14px; } .sig i:nth-child(4) { height: 18px; }
    .q4 .sig i, .q3 .sig i:nth-child(-n+3) { background: #22c55e; }
    .q2 .sig i:nth-child(-n+2) { background: #f59e0b; }
    .q1 .sig i:nth-child(1) { background: #f97316; }
    .q0 .sig i { background: #ef4444; }
    .q0 { border-color: rgba(239,68,68,.6); }
    .qx .sig i { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="hud qx" id="hud" title="DroidDesk"><span class="sig"><i></i><i></i><i></i><i></i></span></div>
  <script src="hud.js"></script>
</body>
</html>
