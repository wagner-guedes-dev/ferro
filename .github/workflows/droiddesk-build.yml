name: DroidDesk — build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release (cria a tag vX.Y.Z com a versão do package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: droiddesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: droiddesk/package-lock.json
      - run: npm ci
      - run: npm test
      # Manual publish: create the version tag first (GitHub only accepts a
      # published release whose tag exists). Then electron-builder creates the
      # Release and uploads the installer + latest.yml for the auto-updater.
      - name: Create version tag
        if: inputs.publish == true
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION" && git push origin "v$VERSION"
          fi
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build only (manual run)
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.publish == true)"
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: droiddesk-windows
          path: |
            droiddesk/dist/*.exe
            droiddesk/dist/latest.yml
          if-no-files-found: error

  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: droiddesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: droiddesk/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: droiddesk-${{ matrix.os }}
          path: |
            droiddesk/dist/*.dmg
            droiddesk/dist/*.AppImage
            droiddesk/dist/*.deb
          if-no-files-found: error
