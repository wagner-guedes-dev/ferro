name: DroidDesk — build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release (cria a tag vX.Y.Z com a versão do package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: droiddesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: droiddesk/package-lock.json
      - run: npm ci
      - run: npm test
      # Manual publish: create the version tag first (GitHub only accepts a
      # published release whose tag exists). Then electron-builder creates the
      # Release and uploads the installer + latest.yml for the auto-updater.
      # Prepare the GitHub Release before electron-builder runs: create it (and
      # the tag) if missing, and remove duplicate releases for the same tag that
      # a previous parallel upload may have created. electron-builder then only
      # uploads assets into this single release.
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version"); TAG="v$VERSION"
          gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="'"$TAG"'") | [.id, (([.assets[].name] | index("latest.yml")) != null), .created_at] | @tsv' > rel.tsv || true
          KEEP=$(awk -F'\t' '$2=="true"{print $1; exit}' rel.tsv)
          [ -z "$KEEP" ] && KEEP=$(sort -t$'\t' -k3 rel.tsv | head -1 | cut -f1)
          while IFS=$'\t' read -r id has created; do
            if [ -n "$id" ] && [ "$id" != "$KEEP" ]; then echo "Removing duplicate release $id"; gh api -X DELETE "repos/$REPO/releases/$id"; fi
          done < rel.tsv
          if [ -z "$KEEP" ]; then
            echo "Creating release $TAG"
            gh release create "$TAG" --title "DroidDesk $VERSION" --notes "DroidDesk $VERSION" --target "$GITHUB_SHA"
          else
            echo "Using existing release $KEEP"
          fi
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build only (manual run)
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.publish == true)"
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: droiddesk-windows
          path: |
            droiddesk/dist/*.exe
            droiddesk/dist/latest.yml
          if-no-files-found: error

  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: droiddesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: droiddesk/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: droiddesk-${{ matrix.os }}
          path: |
            droiddesk/dist/*.dmg
            droiddesk/dist/*.AppImage
            droiddesk/dist/*.deb
          if-no-files-found: error
