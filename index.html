<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferro</title>
<meta name="description" content="Treino, dieta, água e evolução em um só lugar.">
<meta name="theme-color" content="#2A4BFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <div>
    <p id="saudacao" class="saudacao"></p>
    <p id="data" class="data"></p>
  </div>
  <div id="chip-streak" class="chip-streak" aria-live="polite"></div>
</header>

<main id="conteudo"></main>

<nav id="tabbar" class="tabbar" aria-label="Seções">
  <button data-aba="hoje"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Hoje</span></button>
  <button data-aba="treino"><svg viewBox="0 0 24 24"><path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/></svg><span>Treino</span></button>
  <button data-aba="dieta"><svg viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 0 1-16 0zM8 8c0-1.5 1-2 1-3.5M12 8c0-1.5 1-2 1-3.5M16 8c0-1.5 1-2 1-3.5"/></svg><span>Dieta</span></button>
  <button data-aba="evolucao"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg><span>Evolução</span></button>
  <button data-aba="coach"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Coach</span></button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="confete" aria-hidden="true"></canvas>

<script src="data.js"></script>
<script src="perfil.js"></script>
<script src="app.js"></script>
</body>
</html>
